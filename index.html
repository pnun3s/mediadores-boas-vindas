<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mediadores — Bem-vindos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Public+Sans:wght@400;500;600&display=swap');

  :root {
    --sand: #F6F1E7;
    --azulejo: #204257;
    --azulejo-deep: #16303F;
    --ochre: #C99A2E;
    --line: #D8CFBC;
    --ink: #1E2A2F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--sand);
    color: var(--ink);
    font-family: 'Public Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 480px;
    padding: 0 0 48px;
  }

  .hero {
    background: var(--azulejo);
    padding: 40px 28px 32px;
    position: relative;
    overflow: hidden;
  }

  .tile-pattern {
    position: absolute;
    inset: 0;
    opacity: 0.18;
    background-image:
      linear-gradient(45deg, var(--sand) 25%, transparent 25%),
      linear-gradient(-45deg, var(--sand) 25%, transparent 25%);
    background-size: 34px 34px;
    background-position: 0 0, 17px 17px;
  }

  .hero-content {
    position: relative;
  }

  .hero h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 2rem;
    line-height: 1.15;
    color: var(--sand);
    margin: 0 0 10px;
  }

  .hero p {
    color: var(--sand);
    opacity: 0.88;
    font-size: 0.98rem;
    line-height: 1.5;
    margin: 0;
    max-width: 34ch;
  }

  .instructions {
    padding: 24px 28px 8px;
    font-size: 0.92rem;
    color: var(--ink);
    opacity: 0.75;
    line-height: 1.5;
  }

  .lang-list {
    padding: 8px 20px 0;
    display: flex;
    flex-direction: column;
  }

  .lang-row {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    align-items: center;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 18px 8px;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
    transition: background 0.15s ease;
  }

  .lang-row:first-child { border-top: 1px solid var(--line); }

  .lang-row:hover { background: rgba(32, 66, 87, 0.05); }

  .lang-row.playing { background: rgba(201, 154, 46, 0.12); }

  .lang-native {
    font-family: 'Fraunces', serif;
    font-size: 1.3rem;
    font-weight: 600;
    grid-column: 1;
    grid-row: 1;
  }

  .lang-pt {
    font-size: 0.85rem;
    color: var(--ink);
    opacity: 0.6;
    grid-column: 1;
    grid-row: 2;
  }

  .play-icon {
    grid-column: 2;
    grid-row: 1 / 3;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--azulejo);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .lang-row.playing .play-icon { background: var(--ochre); }

  .icon-play, .icon-pause {
    width: 18px;
    height: 18px;
    fill: var(--sand);
  }

  .icon-pause { display: none; }
  .lang-row.playing .icon-play { display: none; }
  .lang-row.playing .icon-pause { display: block; }

  .contact {
    margin: 32px 28px 0;
    padding: 18px 20px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 0.88rem;
    line-height: 1.6;
  }

  .contact strong {
    font-family: 'Fraunces', serif;
    font-size: 1rem;
    display: block;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="hero">
    <div class="tile-pattern"></div>
    <div class="hero-content">
      <h1>Bem-vindos!</h1>
      <p>Somos os mediadores desta escola. Toque na sua língua para ouvir uma mensagem de boas-vindas.</p>
    </div>
  </div>

  <div class="instructions">Escolha a sua língua abaixo</div>

  <div class="lang-list">
    
      <button class="lang-row" data-target="audio-en" aria-label="Ouvir em English">
        <span class="lang-native" >English</span>
        <span class="lang-pt">Inglês</span>
        <span class="play-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon-play"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" class="icon-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </span>
      </button>

      <button class="lang-row" data-target="audio-fr" aria-label="Ouvir em Français">
        <span class="lang-native" >Français</span>
        <span class="lang-pt">Francês</span>
        <span class="play-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon-play"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" class="icon-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </span>
      </button>

      <button class="lang-row" data-target="audio-es" aria-label="Ouvir em Español">
        <span class="lang-native" >Español</span>
        <span class="lang-pt">Espanhol</span>
        <span class="play-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon-play"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" class="icon-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </span>
      </button>

      <button class="lang-row" data-target="audio-ru" aria-label="Ouvir em Русский">
        <span class="lang-native" >Русский</span>
        <span class="lang-pt">Russo</span>
        <span class="play-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon-play"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" class="icon-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </span>
      </button>

      <button class="lang-row" data-target="audio-uk" aria-label="Ouvir em Українська">
        <span class="lang-native" >Українська</span>
        <span class="lang-pt">Ucraniano</span>
        <span class="play-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon-play"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" class="icon-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </span>
      </button>

      <button class="lang-row" data-target="audio-ar" aria-label="Ouvir em العربية">
        <span class="lang-native" dir="rtl">العربية</span>
        <span class="lang-pt">Árabe</span>
        <span class="play-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon-play"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" class="icon-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </span>
      </button>

      <button class="lang-row" data-target="audio-zh" aria-label="Ouvir em 中文">
        <span class="lang-native" >中文</span>
        <span class="lang-pt">Chinês</span>
        <span class="play-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon-play"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" class="icon-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </span>
      </button>
  </div>

  <div class="contact">
    <strong>Contacto dos mediadores</strong>
    mediadores@aezuff.org
  </div>
</div>

<script>
  const rows = document.querySelectorAll('.lang-row');
  let current = null;

  rows.forEach(row => {
    const audio = document.getElementById(row.dataset.target);
    row.addEventListener('click', () => {
      if (current && current !== audio) {
        current.pause();
        current.currentTime = 0;
        document.querySelector('.lang-row.playing')?.classList.remove('playing');
      }
      if (audio.paused) {
        audio.play();
        row.classList.add('playing');
        current = audio;
      } else {
        audio.pause();
        audio.currentTime = 0;
        row.classList.remove('playing');
        current = null;
      }
    });
    audio.addEventListener('ended', () => {
      row.classList.remove('playing');
      current = null;
    });
  });
</script>
